[package]
name = "hyperion_worker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ottimizzazioni crittografiche Bitcoin e hashing
secp256k1 = { version = "0.29.1", features = ["global-context"] }
sha2 = "0.10.8"
ripemd = "0.1.3"
bs58 = { version = "0.5.1", features = ["check"] }
bech32 = "0.9.1"

# Comunicazione di rete leggera (sincrona, ideale per CPU multithreaded)
ureq = { version = "2.9.7", features = ["json"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.118"

# Gestione argomenti
clap = { version = "4.5.7", features = ["derive"] }
ctrlc = "3.4.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
